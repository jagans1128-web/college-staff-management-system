services:
  # ----------------------------------------------------
  # 1. Backend Web Service (Node.js + Express + MongoDB)
  # ----------------------------------------------------
  - type: web
    name: college-staff-backend
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true

  # ----------------------------------------------------
  # 2. Frontend Static Site (React + Vite SPA)
  # ----------------------------------------------------
  - type: web
    name: college-staff-frontend
    runtime: static
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
